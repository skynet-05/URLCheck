# Build and publish Link Guard OTA APK when a linkguard-v* tag is pushed.
name: Link Guard release

on:
  push:
    tags:
      - 'linkguard-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from Gradle
        id: version
        run: |
          VC=$(grep -E 'versionCode' app/build.gradle | head -1 | grep -oE '[0-9]+')
          VN=$(grep -E 'versionName' app/build.gradle | head -1 | grep -oE '"[^"]+"' | tr -d '"')
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "name=$VN" >> "$GITHUB_OUTPUT"

      - name: Build signed Link Guard APK
        run: ./gradlew assembleDebug

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="app/build/outputs/apk/debug/LinkGuard.apk"
          test -f "$APK"
          gh release create "$TAG" "$APK" \
            --title "Link Guard ${TAG#linkguard-v}" \
            --notes "versionCode: ${{ steps.version.outputs.code }}
          versionName: ${{ steps.version.outputs.name }}

          OTA update for **Link Guard** (\`live.notonline.linkguard\`).
          Asset: \`LinkGuard.apk\` (signed with repo \`signing/linkguard.jks\`)." \
            --prerelease
